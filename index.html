<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nikku's Magical World ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Kawaii & Cuddly Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;600&family=Fredoka:wght@400;600&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d0415;
            --kawaii-pink: #ffc2d1;
            --magic-blue: #bde0fe;
            --soft-white: #fffaff;
            --accent-pink: #ff85a2;
        }

        /* Essential Mobile Fixes */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-deep);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(160deg, #0d0415 0%, #1d1135 100%);
            color: var(--soft-white);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cute-font { font-family: 'DynaPuff', cursive; }
        .handwritten { font-family: 'Gaegu', cursive; }

        /* Super Bubbly Card */
        .glass-card {
            background: rgba(45, 30, 70, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 194, 209, 0.4);
            box-shadow: 0 0 40px rgba(255, 133, 162, 0.3);
            border-radius: 3.5rem;
            width: 92%;
            max-width: 360px;
            margin: auto;
            position: relative;
            z-index: 20;
            padding: 2rem;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .glass-card::-webkit-scrollbar { display: none; }

        /* Pudding Buttons */
        .pill-btn {
            border-radius: 999px;
            background: linear-gradient(135deg, #ff85a2 0%, #ffafcc 100%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            box-shadow: 0 8px 15px rgba(255, 133, 162, 0.4);
        }
        .pill-btn:active { transform: scale(0.92); }

        /* Animations */
        .floating { animation: floatAnim 3s ease-in-out infinite; }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .puffy-entry { animation: puffyIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes puffyIn {
            0% { opacity: 0; transform: scale(0.6) translateY(50px); filter: blur(5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* Interactive Elements */
        .scratch-box {
            position: relative; 
            width: 100%; 
            height: 140px;
            margin: 1rem auto; 
            border-radius: 2rem; 
            overflow: hidden;
            border: 3px solid var(--kawaii-pink);
            touch-action: none;
        }
        canvas#scratchCanvas { position: absolute; top: 0; left: 0; z-index: 10; width: 100%; height: 100%; }
        .scratch-inner {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #1c0a2e; padding: 15px; text-align: center;
        }

        .invisible-ink {
            color: transparent; 
            transition: all 0.6s ease; 
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            display: inline-block;
            cursor: pointer;
            border: 1px dashed var(--kawaii-pink);
            user-select: none;
        }
        .invisible-ink.revealed { 
            color: #fff; 
            text-shadow: 0 0 10px var(--accent-pink);
            background: rgba(255, 133, 162, 0.3);
            border-style: solid;
        }

        .progress-bar {
            height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; width: 60%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(to right, #ff85a2, #bde0fe); 
            transition: width 0.5s ease; 
        }
        
        .sparkle-trail {
            position: fixed; pointer-events: none; z-index: 9999;
            animation: sparkOut 0.7s ease-out forwards;
        }
        @keyframes sparkOut {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(0); opacity: 0; }
        }

        .star-sparkle {
            position: absolute; background: white; border-radius: 50%; pointer-events: none;
            animation: twinkle 3s infinite;
        }
        @keyframes twinkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 0.4; }
        }
    </style>
</head>
<body onclick="spawnSparkle(event)">

    <div id="stars-container" class="fixed inset-0 pointer-events-none z-0"></div>
    <div id="decorations" class="fixed inset-0 pointer-events-none z-0"></div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Lock Screen -->
    <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0510]">
        <div class="glass-card text-center puffy-entry">
            <div class="text-[70px] mb-6 floating">🐰</div>
            <h1 class="cute-font text-3xl text-pink-300 mb-3">Hello Nikku!</h1>
            <p class="text-slate-400 text-sm mb-8 handwritten text-xl">Duniya ki sabse pyari ladki ke liye... ✨</p>
            <input type="password" id="passCode" placeholder="Nikku?" class="w-full bg-purple-900/20 px-6 py-4 rounded-full border-2 border-pink-500/30 focus:border-pink-400 outline-none text-center text-pink-200 mb-6 font-bold text-xl tracking-widest">
            <button onclick="unlockBook()" class="w-full text-white font-bold py-4 pill-btn text-lg shadow-lg">Open Magic! ✨</button>
            <p id="errorMsg" class="hidden text-pink-400 text-xs mt-4 font-bold animate-bounce">Arey! Password 'nikku' hai 🥺</p>
        </div>
    </div>

    <!-- Main Book -->
    <div id="bookContainer" class="hidden w-full h-full flex-col items-center justify-center z-10 px-4">
        <div class="flex flex-col items-center mb-6 w-full">
            <h2 class="cute-font text-2xl text-pink-300 mb-3">Magic Book 🍭</h2>
            <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width: 5%;"></div></div>
            <p id="pageNumber" class="text-[10px] text-pink-100 mt-2 font-bold uppercase tracking-widest bg-pink-500/20 px-3 py-1 rounded-full">Story 1 / 20</p>
        </div>

        <div class="relative glass-card flex flex-col items-center justify-center text-center" id="pageDisplay">
            <!-- Dynamic Content -->
        </div>

        <div class="flex justify-between items-center mt-6 w-full max-w-[320px] mx-auto pb-4">
            <button id="prevBtn" onclick="changePage(-1)" class="text-pink-200/60 text-xs font-bold px-4 py-2 opacity-0 pointer-events-none transition-all">← Back</button>
            <button id="nextBtn" onclick="changePage(1)" class="text-white bg-pink-500 px-8 py-3 pill-btn font-bold text-md shadow-lg">Nextie →</button>
        </div>
    </div>

    <script>
        const correctPassword = "nikku"; 
        let currentPage = 1;
        const totalPages = 20;

        const bookData = {
            1: { emoji: '🥺', title: 'I Am Sowwy!', text: 'Nikku, main jaanta hoon mujhse galti hui. Ye 20 magical pages sirf tumhe hasane ke liye hain.' },
            2: { emoji: '🪄', title: 'Magic Wish', text: 'Eyes band karo... Maine ek spell cast kiya hai jisse tumhara gussa gayab ho jayega! 🫧' },
            3: { emoji: '💌', title: 'Secret Tap', text: 'Box par tap karke reveal karo ek secret: <br><br><span class="invisible-ink handwritten text-2xl" onclick="this.classList.toggle(\'revealed\')">Duniya ki sabse pyari Nikku! ❤️</span>' },
            4: { emoji: '🐱', title: 'Kitty Face', text: 'Main bilkul ek cute kitten jaisi shakal bana ke maafi maang raha hoon. Maan jaao na? 🐾' },
            5: { emoji: '🍭', title: 'Candy Pact', text: 'Deal: Maafi ke badle dher saari ice-cream aur chocolates jab hum milenge! 🍦🍫' },
            6: { emoji: '🦋', title: 'Titliyan', text: 'Jab tum smile karti ho, mere dil mein hazaron titliyan udne lagti hain. Ek smile please? 🦋' },
            7: { emoji: '🤳', title: 'Look Here', text: 'Phone ke reflection mein dekho... Wahan jo sabse beautiful insaan hai, wahi meri har khushi hai. ❤️' },
            8: { emoji: '🌈', title: 'Rainbow Bond', text: 'Jhagre badal hain, hamari dosti hamesha rainbow ki tarah chamkegi! 🌈' },
            9: { emoji: '🍼', title: 'Baby Mode', text: 'Arey Nikku baby, itna gussa kyun? Gusse mein cheeks kitne cute lagte hain na? Maan jaao! 🍼' },
            10: { emoji: '🎁', title: 'Scratch Prize', type: 'scratch', text: 'Box scratch karke apna secret gift dekho!' },
            11: { emoji: '🌙', title: 'Sleepy Sorry', text: 'Mujhe neend nahi aayegi jab tak tumhara "Maaf Kiya" message nahi aa jata. Sorry na! 😴' },
            12: { emoji: '❄️', title: 'Chill Pill', text: 'Ye lo ek virtual scoop 🍦... Thanda thanda feel karo aur sara gussa dabba do.' },
            13: { emoji: '🌸', title: 'Blooming', text: 'Duniya ke saare phool milkar bhi tumhare jitne sundar nahi ho sakte. You are my star! 🌸' },
            14: { emoji: '🦄', title: 'Magical Us', text: 'Humara bond itna magical aur rare hai ki hum ise chhoti baaton pe kharab nahi kar sakte. ✨' },
            15: { emoji: '🌬️', title: 'Halki Saans', text: 'Ek gehri saans lo... aur bolo "Main sabse cute hoon, gussa khatam!" 😂 🧘‍♀️' },
            16: { emoji: '💖', title: 'Heart Tap', type: 'pulse', text: 'Is heart par tap karke dekho, ye tumhare liye hi itna fast dhadak raha hai! ✨' },
            17: { emoji: '🍕', title: 'Yummy Deal', text: 'Promise! Next time hum tumhara sabse favorite khana khayenge bina kisi fight ke! 🍟' },
            18: { emoji: '🎶', title: 'Music Mode', text: 'Ye background music suniye... Iski har ek dhun mein mera "Sorry" hai. ❤️' },
            19: { emoji: '⚖️', title: 'The Faisla', type: 'verdict', text: 'Ab final bataiye... Kya is pagal ko maafi milegi? Pakka?' },
            20: { emoji: '🎉', title: 'Yayyy!', type: 'finale', text: 'Success! Nikku ne maaf kar diya! I love you my star! ❤️ Call pe aao jaldi!' }
        };

        function unlockBook() {
            const input = document.getElementById('passCode').value.toLowerCase();
            if(input === correctPassword) {
                document.getElementById('lockScreen').style.display = 'none';
                const music = document.getElementById('bgMusic');
                if(music) music.play().catch(() => {});
                document.getElementById('bookContainer').classList.remove('hidden');
                document.getElementById('bookContainer').classList.add('flex');
                renderPage();
                celebrate(100);
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
                setTimeout(() => document.getElementById('errorMsg').classList.add('hidden'), 2000);
            }
        }

        function renderPage() {
            const display = document.getElementById('pageDisplay');
            display.classList.remove('puffy-entry');
            void display.offsetWidth; 
            display.classList.add('puffy-entry');
            
            display.innerHTML = '';
            const content = bookData[currentPage];

            const emojiDiv = document.createElement('div');
            emojiDiv.className = "text-[80px] floating mb-6 select-none";
            emojiDiv.innerText = content.emoji;
            if(content.type === 'pulse') {
                emojiDiv.classList.add('cursor-pointer');
                emojiDiv.onclick = () => celebrate(40);
            }
            
            const titleH3 = document.createElement('h3');
            titleH3.className = "cute-font text-2xl text-pink-300 mb-4";
            titleH3.innerText = content.title;
            
            const textP = document.createElement('div');
            textP.className = "text-slate-100 italic text-md leading-relaxed px-1 handwritten text-2xl";
            textP.innerHTML = content.text;

            display.appendChild(emojiDiv);
            display.appendChild(titleH3);
            display.appendChild(textP);

            if(content.type === 'scratch') {
                const scratchHTML = `<div class="scratch-box shadow-xl mt-4"><div class="scratch-inner"><p class="text-pink-300 font-bold p-2 text-sm">Promise: Agli baar bina baat call cut nahi karunga! ❤️</p></div><canvas id="scratchCanvas"></canvas></div>`;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = scratchHTML;
                display.appendChild(tempDiv);
                setTimeout(initScratchCard, 200);
            }

            if(content.type === 'verdict') {
                const buttons = `<div class="flex flex-col space-y-4 items-center mt-8 w-full"><button onclick="changePage(1)" class="w-full bg-green-500 text-white font-bold py-4 rounded-full pill-btn text-lg">Haan, Maaf Kiya! ✅</button><button id="noBtn" onclick="moveNoButton()" class="text-pink-200/40 text-xs underline italic">Nahi! (Pakad ke dikhao)</button></div>`;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = buttons;
                display.appendChild(tempDiv);
            }

            if(content.type === 'finale') {
                celebrate(200);
                setInterval(() => celebrate(50), 3000);
            }

            updateUI();
        }

        function changePage(dir) {
            if(currentPage + dir >= 1 && currentPage + dir <= totalPages) {
                currentPage += dir;
                renderPage();
            }
        }

        function updateUI() {
            document.getElementById('progressFill').style.width = (currentPage / totalPages * 100) + '%';
            document.getElementById('pageNumber').innerText = `Story ${currentPage} / ${totalPages}`;
            
            const prev = document.getElementById('prevBtn');
            if(currentPage === 1) {
                prev.style.opacity = '0';
                prev.style.pointerEvents = 'none';
            } else {
                prev.style.opacity = '1';
                prev.style.pointerEvents = 'auto';
            }

            const next = document.getElementById('nextBtn');
            if(currentPage === totalPages || currentPage === 19) {
                next.style.visibility = 'hidden';
            } else {
                next.style.visibility = 'visible';
            }
        }

        function initScratchCard() {
            const canvas = document.getElementById('scratchCanvas');
            if(!canvas) return;
            const container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            
            ctx.fillStyle = '#6b4194'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 14px Fredoka';
            ctx.fillStyle = '#ffc2d1';
            ctx.textAlign = 'center';
            ctx.fillText('RUB KARO ❤️', canvas.width/2, canvas.height/2 + 5);

            const scratch = (x, y) => {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 25, 0, Math.PI * 2);
                ctx.fill();
            };

            const handleMove = (e) => {
                if(!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                scratch(clientX - rect.left, clientY - rect.top);
                e.preventDefault();
            };

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; }, {passive: false});
            window.addEventListener('mouseup', () => isDrawing = false);
            window.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('touchmove', handleMove, {passive: false});
        }

        function celebrate(count) {
            confetti({ particleCount: count, spread: 80, origin: { y: 0.8 }, colors: ['#ffafcc', '#ff85a2', '#ffffff'] });
        }

        function moveNoButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.innerText = "Pakad nahi payi! 😜";
        }

        function spawnSparkle(e) {
            const p = document.createElement('div');
            p.className = 'sparkle-trail text-2xl select-none';
            p.innerText = ['✨', '💖', '⭐'][Math.floor(Math.random()*3)];
            p.style.left = e.clientX + 'px';
            p.style.top = e.clientY + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 700);
        }

        window.onload = function() {
            const starCont = document.getElementById('stars-container');
            const decorCont = document.getElementById('decorations');
            for(let i=0; i<30; i++) {
                const s = document.createElement('div');
                s.className = 'star-sparkle';
                s.style.width = Math.random()*4 + 'px';
                s.style.height = s.style.width;
                s.style.left = Math.random()*100 + 'vw';
                s.style.top = Math.random()*100 + 'vh';
                s.style.animationDelay = Math.random()*3 + 's';
                starCont.appendChild(s);
            }
            setInterval(() => {
                const d = document.createElement('div');
                d.className = 'floating fixed pointer-events-none opacity-20 text-3xl';
                d.innerText = ['🌸', '✨', '🧸', '🦋', '🐱', '🍰'][Math.floor(Math.random()*6)];
                d.style.left = Math.random()*100 + 'vw';
                d.style.top = Math.random()*100 + 'vh';
                decorCont.appendChild(d);
                setTimeout(() => d.remove(), 6000);
            }, 1500);
        };
    </script>
</body>
</html>
